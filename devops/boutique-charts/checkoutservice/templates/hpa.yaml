apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Values.checkoutService.name }}-hpa
  namespace: {{ .Release.Namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.checkoutService.name }}
  minReplicas: {{ .Values.checkoutService.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.checkoutService.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.checkoutService.autoscaling.targetCPUUtilizationPercentage }}

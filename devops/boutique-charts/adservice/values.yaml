images:
  repository: bravelove123/ecr
  tag: "e127726c"
  # Optional: fullImage overrides repository/name/tag assembly above.
  # Set this to the complete image (e.g. "bravelove123/ecr:d30e2dbf") when your image
  # is pushed as <repo>:<tag> rather than <repo>/<service>:<tag>.
  fullImage: "bravelove123/ecr:d30e2dbf"

serviceAccounts:
  create: true
  annotations: {}
  annotationsOnlyForCartservice: false

networkPolicies:
  create: false

sidecars:
  create: false

authorizationPolicies:
  create: false

opentelemetryCollector:
  create: false
  name: opentelemetrycollector
  projectId: "PROJECT_ID"

seccompProfile:
  enable: false
  type: RuntimeDefault

securityContext:
  enable: true

productCatalogService:
  name: productcatalogservice

shippingService:
  name: shippingservice

paymentService:
  name: paymentservice

emailService:
  name: emailservice

currencyService:
  name: currencyservice

cartService:
  name: cartservice

adservice:
  create: true
  name: adservice
  containerPort: 9555
  servicePort: 9555
  resources:
    requests:
      cpu: 200m
      memory: 180Mi
    limits:
      cpu: 300m
      memory: 300Mi
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80

googleCloudOperations:
  profiler: false
  tracing: false
  metrics: false

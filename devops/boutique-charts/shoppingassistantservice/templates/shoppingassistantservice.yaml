{{- if .Values.shoppingassistantservice.create }}
{{- if .Values.serviceAccounts.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.shoppingassistantservice.name }}
  namespace: {{ .Release.Namespace }}
  {{- if not .Values.serviceAccounts.annotationsOnlyForCartservice }}
  {{- with .Values.serviceAccounts.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
---
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.shoppingassistantservice.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.shoppingassistantservice.name }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.shoppingassistantservice.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.shoppingassistantservice.name }}
    spec:
      {{- if .Values.serviceAccounts.create }}
      serviceAccountName: {{ .Values.shoppingassistantservice.name }}
      {{- else }}
      serviceAccountName: default
      {{- end }}
      {{- if .Values.securityContext.enable }}
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        {{- if and .Values.seccompProfile.enable .Values.seccompProfile.type }}
        seccompProfile:
          type: {{ .Values.seccompProfile.type }}
        {{- end }}
      {{- end }}
      containers:
        - name: server
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
          image: >-
            {{- if .Values.images.fullImage }}
            {{ .Values.images.fullImage }}
            {{- else }}
            {{ .Values.images.repository }}/{{ .Values.shoppingassistantservice.name }}:{{ .Values.images.tag | default .Chart.AppVersion }}
            {{- end }}
          ports:
            - containerPort: 5050
          readinessProbe:
            grpc:
              port: 5050
          livenessProbe:
            grpc:
              port: 5050
          env:
            - name: PORT
              value: "5050"
            - name: PRODUCT_CATALOG_SERVICE_ADDR
              value: "{{ .Values.productCatalogService.name }}:3550"
            - name: SHIPPING_SERVICE_ADDR
              value: "{{ .Values.shippingService.name }}:50051"
            - name: PAYMENT_SERVICE_ADDR
              value: "{{ .Values.paymentService.name }}:50051"
            - name: EMAIL_SERVICE_ADDR
              value: "{{ .Values.shoppingassistantservice.name }}:5000"
            - name: CURRENCY_SERVICE_ADDR
              value: "{{ .Values.shoppingassistantservice.name }}:7000"
            - name: CART_SERVICE_ADDR
              value: "{{ .Values.cartService.name }}:7070"
            {{- if .Values.opentelemetryCollector.create }}
            - name: COLLECTOR_SERVICE_ADDR
              value: "{{ .Values.opentelemetryCollector.name }}:4317"
            - name: OTEL_SERVICE_NAME
              value: "{{ .Values.shoppingassistantservice.name }}"
            {{- end }}
            {{- if .Values.googleCloudOperations.tracing }}
            - name: ENABLE_TRACING
              value: "1"
            {{- end }}
            {{- if .Values.googleCloudOperations.profiler }}
            - name: ENABLE_PROFILER
              value: "1"
            {{- end }}
          resources:
            {{- toYaml .Values.shoppingassistantservice.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.shoppingassistantservice.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.shoppingassistantservice.name }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.shoppingassistantservice.name }}
  ports:
    - name: grpc
      port: 5050
      targetPort: 5050
{{- if .Values.networkPolicies.create }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.shoppingassistantservice.name }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.shoppingassistantservice.name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: {{ .Values.shoppingassistantservice.name }}
      ports:
        - port: 5050
          protocol: TCP
  egress:
    - {}
{{- end }}

{{- if .Values.sidecars.create }}
---
apiVersion: networking.istio.io/v1beta1
kind: Sidecar
metadata:
  name: {{ .Values.shoppingassistantservice.name }}
  namespace: {{ .Release.Namespace }}
spec:
  workloadSelector:
    labels:
      app: {{ .Values.shoppingassistantservice.name }}
  egress:
    - hosts:
        - istio-system/*
        - ./{{ .Values.cartService.name }}.{{ .Release.Namespace }}.svc.cluster.local
        - ./{{ .Values.shoppingassistantservice.name }}.{{ .Release.Namespace }}.svc.cluster.local
        - ./{{ .Values.shoppingassistantservice.name }}.{{ .Release.Namespace }}.svc.cluster.local
        - ./{{ .Values.paymentService.name }}.{{ .Release.Namespace }}.svc.cluster.local
        - ./{{ .Values.productCatalogService.name }}.{{ .Release.Namespace }}.svc.cluster.local
        - ./{{ .Values.shippingService.name }}.{{ .Release.Namespace }}.svc.cluster.local
        {{- if .Values.opentelemetryCollector.create }}
        - ./{{ .Values.opentelemetryCollector.name }}.{{ .Release.Namespace }}.svc.cluster.local
        {{- end }}
{{- end }}

{{- if .Values.authorizationPolicies.create }}
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ .Values.shoppingassistantservice.name }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.shoppingassistantservice.name }}
  rules:
    - from:
        - source:
            principals:
              {{- if .Values.serviceAccounts.create }}
              - cluster.local/ns/{{ .Release.Namespace }}/sa/{{ .Values.shoppingassistantservice.name }}
              {{- else }}
              - cluster.local/ns/{{ .Release.Namespace }}/sa/default
              {{- end }}
      to:
        - operation:
            paths:
              - /hipstershop.shoppingassistantservice/PlaceOrder
            methods:
              - POST
            ports:
              - "5050"
{{- end }}
{{- end }}

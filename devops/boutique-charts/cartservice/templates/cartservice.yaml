{{- if .Values.cartservice.create }}
{{- if .Values.serviceAccounts.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.cartservice.name }}
  namespace: {{ .Release.Namespace }}
  {{- if not .Values.serviceAccounts.annotationsOnlyForCartservice }}
  {{- with .Values.serviceAccounts.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
---
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.cartservice.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.cartservice.name }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.cartservice.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.cartservice.name }}
    spec:
      {{- if .Values.serviceAccounts.create }}
      serviceAccountName: {{ .Values.cartservice.name }}
      {{- else }}
      serviceAccountName: default
      {{- end }}
      {{- if .Values.securityContext.enable }}
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        {{- if and .Values.seccompProfile.enable .Values.seccompProfile.type }}
        seccompProfile:
          type: {{ .Values.seccompProfile.type }}
        {{- end }}
      {{- end }}
      terminationGracePeriodSeconds: 5
      containers:
        - name: server
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
          image: "{{ .Values.images.repository }}:{{ .Values.images.tag | default .Chart.AppVersion }}"
          ports:
            - containerPort: 7070
          env:
            - name: REDIS_ADDR
              value: "redis-cart:6379"
          resources:
            {{- toYaml .Values.cartservice.resources | nindent 12 }}
          readinessProbe:
            initialDelaySeconds: 15
            grpc:
              port: 7070
          livenessProbe:
            initialDelaySeconds: 15
            periodSeconds: 10
            grpc:
              port: 7070
---
apiVersion: v1
kind: Service
metadata:
  name: redis-cart
  labels:
    app: redis-cart
spec:
  type: ClusterIP
  selector:
    app: redis-cart
  ports:
    - name: tcp-redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cart
  labels:
    app: redis-cart
spec:
  selector:
    matchLabels:
      app: redis-cart
  template:
    metadata:
      labels:
        app: redis-cart
    spec:
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: redis
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
          image: redis:alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            periodSeconds: 5
            tcpSocket:
              port: 6379
          livenessProbe:
            periodSeconds: 5
            tcpSocket:
              port: 6379
          volumeMounts:
            - mountPath: /data
              name: redis-data
          resources:
            limits:
              memory: 256Mi
              cpu: 125m
            requests:
              cpu: 70m
              memory: 200Mi
      volumes:
        - name: redis-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.cartservice.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.cartservice.name }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.cartservice.name }}
  ports:
    - name: grpc
      port: {{ default 7070 .Values.cartservice.servicePort }}
      targetPort: {{ default 7070 .Values.cartservice.containerPort }}
{{- if .Values.networkPolicies.create }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.cartservice.name }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.cartservice.name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: {{ .Values.frontend.name }}
      ports:
        - port: {{ default 7070 .Values.cartservice.servicePort }}
          protocol: TCP
  egress:
    - {}
{{- end }}

{{- if .Values.sidecars.create }}
---
apiVersion: networking.istio.io/v1beta1
kind: Sidecar
metadata:
  name: {{ .Values.cartservice.name }}
  namespace: {{ .Release.Namespace }}
spec:
  workloadSelector:
    labels:
      app: {{ .Values.cartservice.name }}
  egress:
    - hosts:
        - istio-system/*
        - ./{{ .Values.cartService.name }}.{{ .Release.Namespace }}.svc.cluster.local
        - ./{{ .Values.currencyService.name }}.{{ .Release.Namespace }}.svc.cluster.local
        - ./{{ .Values.emailService.name }}.{{ .Release.Namespace }}.svc.cluster.local
        - ./{{ .Values.paymentService.name }}.{{ .Release.Namespace }}.svc.cluster.local
        - ./{{ .Values.productCatalogService.name }}.{{ .Release.Namespace }}.svc.cluster.local
        - ./{{ .Values.shippingService.name }}.{{ .Release.Namespace }}.svc.cluster.local
        {{- if .Values.opentelemetryCollector.create }}
        - ./{{ .Values.opentelemetryCollector.name }}.{{ .Release.Namespace }}.svc.cluster.local
        {{- end }}
{{- end }}

{{- if .Values.authorizationPolicies.create }}
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ .Values.cartservice.name }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.cartservice.name }}
  rules:
    - from:
        - source:
            principals:
              {{- if .Values.serviceAccounts.create }}
              - cluster.local/ns/{{ .Release.Namespace }}/sa/{{ .Values.frontend.name }}
              {{- else }}
              - cluster.local/ns/{{ .Release.Namespace }}/sa/default
              {{- end }}
      to:
        - operation:
            paths:
              - /hipstershop.cartservice/PlaceOrder
            methods:
              - POST
            ports:
              - "{{ default 7070 .Values.cartservice.servicePort }}"
{{- end }}
{{- end }}

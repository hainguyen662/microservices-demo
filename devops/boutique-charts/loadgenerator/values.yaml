images:
  repository: bravelove123/ecr
  tag: "31cd6155"
  # Optional: fullImage overrides repository/name/tag assembly above.
  # Set this to the complete image (e.g. "bravelove123/ecr:d30e2dbf") when your image
  # is pushed as <repo>:<tag> rather than <repo>/<service>:<tag>.
  fullImage: "bravelove123/ecr:d30e2dbf"

serviceAccounts:
  create: true
  annotations: {}
  annotationsOnlyForCartservice: false

networkPolicies:
  create: false

sidecars:
  create: false

authorizationPolicies:
  create: false

opentelemetryCollector:
  create: false
  name: opentelemetrycollector
  projectId: "PROJECT_ID"

seccompProfile:
  enable: false
  type: RuntimeDefault

securityContext:
  enable: true

productCatalogService:
  name: productcatalogservice

shippingService:
  name: shippingservice

paymentService:
  name: paymentservice

loadgenerator:
  name: loadgenerator

loadgenerator:
  name: loadgenerator

cartService:
  name: cartservice

loadgenerator:
  create: true
  name: loadgenerator
  resources:
    requests:
      cpu: 300m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
googleCloudOperations:
  profiler: false
  tracing: false
  metrics: false

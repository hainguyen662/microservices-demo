{{- if .Values.loadgenerator.create }}
{{- if .Values.serviceAccounts.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.loadgenerator.name }}
  namespace: {{ .Release.Namespace }}
  {{- if not .Values.serviceAccounts.annotationsOnlyForCartservice }}
  {{- with .Values.serviceAccounts.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
---
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.loadgenerator.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.loadgenerator.name }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.loadgenerator.name }}
  replicas: 1
  template:
    metadata:
      labels:
        app: {{ .Values.loadgenerator.name }}
      annotations:
        sidecar.istio.io/rewriteAppHTTPProbers: "true"
    spec:
      serviceAccountName: {{ .Values.loadgenerator.name }}
      terminationGracePeriodSeconds: 5
      restartPolicy: Always
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      initContainers:
        - command:
            - /bin/sh
            - -exc
            - |
              MAX_RETRIES=12
              RETRY_INTERVAL=10
              for i in $(seq 1 $MAX_RETRIES); do
                echo "Attempt $i: Pinging frontend: ${FRONTEND_ADDR}..."
                STATUSCODE=$(wget --server-response http://${FRONTEND_ADDR} 2>&1 | awk '/^  HTTP/{print $2}')
                if [ $STATUSCODE -eq 200 ]; then
                    echo "Frontend is reachable."
                    exit 0
                fi
                echo "Error: Could not reach frontend - Status code: ${STATUSCODE}"
                sleep $RETRY_INTERVAL
              done
              echo "Failed to reach frontend after $MAX_RETRIES attempts."
              exit 1
          name: frontend-check
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
          image: busybox:latest
          env:
            - name: FRONTEND_ADDR
              value: "frontend:80"
      containers:
        - name: main
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
          image: "{{ .Values.images.repository }}:{{ .Values.images.tag | default .Chart.AppVersion }}"
          env:
            - name: FRONTEND_ADDR
              value: "frontend:80"
            - name: USERS
              value: "10"
            - name: RATE
              value: "1"
          resources:
            {{- toYaml .Values.loadgenerator.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.loadgenerator.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.loadgenerator.name }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.loadgenerator.name }}
  ports:
    - name: grpc
      port: 5050
      targetPort: 5050
{{- if .Values.networkPolicies.create }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.loadgenerator.name }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.loadgenerator.name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: {{ .Values.loadgenerator.name }}
      ports:
        - port: 5050
          protocol: TCP
  egress:
    - {}
{{- end }}

{{- if .Values.sidecars.create }}
---
apiVersion: networking.istio.io/v1beta1
kind: Sidecar
metadata:
  name: {{ .Values.loadgenerator.name }}
  namespace: {{ .Release.Namespace }}
spec:
  workloadSelector:
    labels:
      app: {{ .Values.loadgenerator.name }}
  egress:
    - hosts:
        - istio-system/*
        - ./{{ .Values.cartService.name }}.{{ .Release.Namespace }}.svc.cluster.local
        - ./{{ .Values.loadgenerator.name }}.{{ .Release.Namespace }}.svc.cluster.local
        - ./{{ .Values.loadgenerator.name }}.{{ .Release.Namespace }}.svc.cluster.local
        - ./{{ .Values.paymentService.name }}.{{ .Release.Namespace }}.svc.cluster.local
        - ./{{ .Values.productCatalogService.name }}.{{ .Release.Namespace }}.svc.cluster.local
        - ./{{ .Values.shippingService.name }}.{{ .Release.Namespace }}.svc.cluster.local
        {{- if .Values.opentelemetryCollector.create }}
        - ./{{ .Values.opentelemetryCollector.name }}.{{ .Release.Namespace }}.svc.cluster.local
        {{- end }}
{{- end }}

{{- if .Values.authorizationPolicies.create }}
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ .Values.loadgenerator.name }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.loadgenerator.name }}
  rules:
    - from:
        - source:
            principals:
              {{- if .Values.serviceAccounts.create }}
              - cluster.local/ns/{{ .Release.Namespace }}/sa/{{ .Values.loadgenerator.name }}
              {{- else }}
              - cluster.local/ns/{{ .Release.Namespace }}/sa/default
              {{- end }}
      to:
        - operation:
            paths:
              - /hipstershop.loadgenerator/PlaceOrder
            methods:
              - POST
            ports:
              - "5050"
{{- end }}
{{- end }}

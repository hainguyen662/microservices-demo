apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shoppingassistantservice
  namespace: argocd
spec:
  project: boutique
  source:
    repoURL: 'http://192.168.0.104/devops/Boutique-charts.git'
    targetRevision: main
    path: shoppingassistantservice
    helm:
      releaseName: shoppingassistantservice
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: boutique
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
